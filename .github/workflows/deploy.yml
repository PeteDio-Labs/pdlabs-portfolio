# Tests, builds, then deploys to S3 and invalidates CloudFront over GitHub OIDC (PET-816).
# No AWS key exists: the role trusts only this repo's main branch (petedio-iac,
# modules/portfolio-site/iam.tf). Pull requests run ci.yml and never reach the deploy job.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check the build wrote every page
        run: |
          set -eu
          for f in index.html ui.html 404.html toonish.css favicon.svg; do test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }; done
          n=$(ls dist/work/*.html | wc -l)
          echo "dist/work holds $n case-study pages"
          test "$n" -ge 4
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token
      contents: read
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      BUCKET: ${{ vars.BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
    steps:
      # An empty variable would surface as an opaque AWS error, or as a sync to nowhere.
      - name: Require deploy variables
        run: |
          for v in AWS_ROLE_ARN BUCKET DISTRIBUTION_ID; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is empty"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Sync to S3
        run: |
          count=$(find dist -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::dist/ is empty, refusing to sync with --delete"; exit 1; }
          aws s3 sync dist "s3://$BUCKET" --delete --cache-control "public, max-age=300"
          echo "synced $count file(s) to $BUCKET"
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "invalidation $id completed"
