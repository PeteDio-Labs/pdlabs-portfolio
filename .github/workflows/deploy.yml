# Tests, builds, then deploys the static site to S3 and invalidates CloudFront (PET-816). Matches
# deploy_auth = "user" in modules/portfolio-site: the deploy IAM user's key sits in the
# `production` environment secrets, which only main may use. The key reaches the AWS steps
# only, never the install or build steps.
name: deploy

on:
  push:
    branches: [main]
  # Rollback: run this workflow from main with a ref. Blank deploys main's tip. `previous` deploys
  # the commit before main's tip. A SHA or tag deploys that commit. See docs/rollback.md.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to deploy: blank = main tip, previous = the commit before it, or a SHA/tag on main'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_DEFAULT_REGION: us-east-2
      BUCKET: ${{ vars.BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      # The expected ARN of the deploy IAM user, kept in a repository variable so the account ID stays out of the repo.
      DEPLOY_IDENTITY_ARN: ${{ vars.DEPLOY_IDENTITY_ARN }}
    steps:
      # An empty value would surface as an opaque AWS error, or as a sync to nowhere.
      - name: Require deploy variables and secrets
        env:
          HAS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          for v in BUCKET DISTRIBUTION_ID DEPLOY_IDENTITY_ARN; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is empty"; exit 1; }
          done
          [ "$HAS_KEY_ID" = true ] && [ "$HAS_KEY_SECRET" = true ] || { echo "::error::the production environment secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are not both set"; exit 1; }

      # Each action is pinned to a full commit SHA. Dependabot proposes the bumps.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Rebuild from git, so a rollback stores no artifact. The commit must sit on main, which keeps
      # the production key away from code that never passed review.
      - name: Pick the commit to deploy
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -eu
          case "$REF_INPUT" in
            "") target=$(git rev-parse origin/main) ;;
            previous) target=$(git rev-parse origin/main~1) ;;
            *) printf '%s' "$REF_INPUT" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "::error::ref has characters a SHA or tag never has"; exit 1; }
               target=$(git rev-parse --verify "$REF_INPUT^{commit}") ;;
          esac
          git merge-base --is-ancestor "$target" origin/main || { echo "::error::$target is not on main, refusing to deploy it"; exit 1; }
          git checkout --detach "$target"
          {
            echo "### Deploying $(git log -1 --format='%h %s' "$target")"
            echo "main's tip is $(git rev-parse --short origin/main). Input ref: \`${REF_INPUT:-blank}\`."
            [ "$target" = "$(git rev-parse origin/main)" ] || echo "**This is a rollback.** Main still holds the later commits. Open a revert PR so the next merge does not redeploy them (docs/rollback.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The Web Analytics beacon token ships in the page HTML, so it is a repo variable, not a secret.
      # When the variable is unset, build.ts warns and builds without analytics.
      - name: Build
        env:
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: bun run build
      - name: Check the build wrote every page
        run: |
          set -eu
          for f in index.html about.html work.html app.js motion.js studies.json api/studies.json ui.html 404.html toonish.css favicon.svg; do test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }; done
          n=$(ls dist/work/*.html | wc -l)
          echo "dist/work holds $n case-study pages"
          test "$n" -ge 4

      - name: Confirm the deploy identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "$arn"
          [ "$arn" = "$DEPLOY_IDENTITY_ARN" ] || { echo "::error::the deploy key is not the identity named in the DEPLOY_IDENTITY_ARN variable"; exit 1; }

      - name: Sync to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          count=$(find dist -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::dist/ is empty, refusing to sync with --delete"; exit 1; }
          # Pass 1: everything revalidates after five minutes. CSS and JS keep unhashed names, so they stay here.
          aws s3 sync dist "s3://$BUCKET" --delete --cache-control "public, max-age=300"
          # Pass 2: font files keep the same bytes under the same name, so browsers keep them a year.
          # Images and icons keep unhashed names, so they get one day, not a year.
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude "*" --include "fonts/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude "*" --include "*.png" --include "*.svg" \
            --cache-control "public, max-age=86400"
          echo "synced $count file(s) to $BUCKET"

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "invalidation $id completed"

      # A green sync and invalidation prove the upload, not that visitors get the pages. Request the
      # home page, the study index and every study the build wrote, and fail on any answer but 200.
      - name: Verify the live site
        run: |
          set -eu
          paths="/ /about.html /work.html /studies.json /api/studies.json $(jq -r '.[].url, .[].api' dist/api/studies.json)"
          checked=0
          for p in $paths; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "https://pdlab.dev$p")
            echo "$code $p"
            [ "$code" = 200 ] || { echo "::error::https://pdlab.dev$p answered $code, expected 200"; exit 1; }
            case "$p" in /api/*)
              h=$(curl -sSI --retry 3 --retry-all-errors -H 'Origin: https://example.com' "https://pdlab.dev$p")
              echo "$h" | grep -qi '^content-type: application/json' || { echo "::error::$p is not application/json"; exit 1; }
              echo "$h" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::$p has no CORS header; the /api/* behavior needs the petedio-iac change"; exit 1; } ;;
            esac
            checked=$((checked + 1))
          done
          [ "$checked" -gt 4 ] || { echo "::error::checked only $checked URL(s); studies.json listed none"; exit 1; }
          echo "verified $checked live URL(s)"
