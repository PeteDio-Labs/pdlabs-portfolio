name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check the build wrote every page
        run: |
          set -eu
          for f in index.html about.html work.html app.js motion.js studies.json api/studies.json ui.html 404.html toonish.css favicon.svg; do test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }; done
          n=$(ls dist/work/*.html | wc -l)
          echo "dist/work holds $n case-study pages"
          test "$n" -ge 4
      - name: Install Chromium for the accessibility check
        run: bunx playwright-core install --with-deps chromium
      - name: Accessibility check (axe at WCAG 2.2 AA on every built page)
        run: bun run test:a11y
